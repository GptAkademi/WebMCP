<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebMCP Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fas fa-layer-group"></i>
                <h1>WebMCP Kanban</h1>
            </div>
            <button id="add-task-btn" class="primary-btn">
                <i class="fas fa-plus"></i> New Task
            </button>
        </header>

        <main class="board">
            <div class="column" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h2>To Do</h2>
                    <span class="count" id="todo-count">0</span>
                </div>
                <div class="task-list" id="todo-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <div class="column" id="in-progress" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h2>In Progress</h2>
                    <span class="count" id="in-progress-count">0</span>
                </div>
                <div class="task-list" id="in-progress-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <div class="column" id="done" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h2>Done</h2>
                    <span class="count" id="done-count">0</span>
                </div>
                <div class="task-list" id="done-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for adding tasks -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="Enter task title...">
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Enter task details..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="primary-btn">Create Task</button>
                </div>
            </form>
        </div>
    </div>
     <script src="https://unpkg.com/@mcp-b/global@latest/dist/index.iife.js"></script>
      <script src="script.js"></script>
</body>

</html>
